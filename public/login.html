<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · AI Reader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --error: #ef4444;
        --border: #334155;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      p.subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
      }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      input[type="password"] {
        width: 100%;
        padding: 11px 14px;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s;
      }
      input[type="password"]:focus { border-color: var(--accent); }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 11px 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .error {
        margin-top: 14px;
        padding: 10px 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--error);
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }
      .error.show { display: block; }
    </style>
  </head>
  <body>
    <form class="card" id="loginForm">
      <h1>AI Reader</h1>
      <p class="subtitle">请输入访问密码</p>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus />
      <button id="submit" type="submit">登录</button>
      <div class="error" id="error"></div>
    </form>
    <script>
      const form = document.getElementById("loginForm");
      const input = document.getElementById("password");
      const btn = document.getElementById("submit");
      const err = document.getElementById("error");

      fetch("/api/auth/me", { credentials: "same-origin" })
        .then((r) => r.json())
        .then((d) => {
          if (d && d.data && d.data.authed) window.location.replace("/");
        })
        .catch(() => {});

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "登录中...";
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ password: input.value }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            window.location.replace("/");
            return;
          }
          err.textContent = (data && data.error) || "登录失败";
          err.classList.add("show");
        } catch (e) {
          err.textContent = "网络错误，请稍后重试";
          err.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "登录";
        }
      });
    </script>
  </body>
</html>
